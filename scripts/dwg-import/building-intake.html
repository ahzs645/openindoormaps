<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAD building intake</title><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui;color:#173248;background:#f2f5f6}header{padding:14px 20px;background:white;border-bottom:1px solid #d0dbe2;height:80px;display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:20px;margin:0 0 4px}h2{font-size:17px}button,select,input{font:inherit;padding:9px;border:1px solid #bacbd6;border-radius:7px;background:white;color:inherit}button{cursor:pointer}button:hover{background:#e8f3f8}main{height:calc(100dvh - 80px);display:grid;grid-template-columns:330px 1fr}aside{overflow:auto;padding:18px;background:white;border-right:1px solid #d0dbe2}label{display:block;margin:14px 0 6px}select{width:100%}.sub,p{color:#4c6678;line-height:1.5}.sub{font-size:13px}p{font-size:14px}.warning{background:#fff3d8;padding:10px;border-radius:7px;font-size:13px}.canvas{min-width:0;min-height:0;position:relative}.canvas svg{display:block;width:100%;height:100%;touch-action:none}.toolbar{position:absolute;top:12px;right:12px;display:flex;gap:6px}.legend{position:absolute;bottom:12px;left:12px;padding:10px;background:#ffffffe8;border-radius:8px;font-size:13px}#rooms{max-height:220px;overflow:auto}.room{width:100%;text-align:left;border-radius:0;font-size:13px;border-width:0 0 1px}.checks{display:flex;gap:6px;align-items:center}.checks input{width:auto}#connections button{display:block;width:100%;text-align:left;margin:6px 0}.metric{display:inline-block;padding:4px 7px;border-radius:5px;background:#e8f0f4;margin:2px;font-size:12px}@media(max-width:700px){main{display:flex;flex-direction:column-reverse}aside{height:44%;border-top:1px solid #ccd7df}.canvas{height:56%}header{padding:10px}h1{font-size:17px}header button{font-size:12px}#rooms{max-height:110px}.legend{font-size:11px;padding:6px}.toolbar button{font-size:12px}}
</style></head><body><header><div><h1>CAD building intake</h1><div class="sub" id="summary">Loading floor stacks…</div></div><a href="intake.json" download><button>Download building intake</button></a></header><main><aside><label for="building">Building / campus drawing</label><select id="building"></select><label for="floor">Schematic floor</label><select id="floor"></select><label class="checks"><input id="overlay" type="checkbox" checked>Compare other floors</label><label class="checks"><input id="symbols" type="checkbox" checked>Show schematic stair hints</label><div id="facts"></div><details id="alignment-review"><summary>Review floor orientation</summary><label for="rotation">Additional rotation</label><select id="rotation"><option value="0">0°</option><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option></select><label for="east">Horizontal adjustment (metres)</label><input id="east" type="number" min="-200" max="200" step="0.1" value="0"><label for="north">Vertical adjustment (metres)</label><input id="north" type="number" min="-200" max="200" step="0.1" value="0"><button id="save-alignment">Save floor review</button><button id="reset-alignment">Reset floor review</button><p id="review-status" role="status"></p><button id="export-review">Download floor reviews</button></details><div class="warning" id="status"></div><h2 id="room-title">Rooms</h2><input id="search" aria-label="Find room" placeholder="Find a room"><div id="rooms"></div><h2 id="connections-title">Stair connections</h2><div id="connections"></div><p id="selection"></p><details><summary>Source and placement</summary><p id="source"></p><a href="UNBC.building-intake.zip" download>Download all building files</a></details></aside><section class="canvas"><svg id="drawing" aria-label="Dimensioned local floor drawing"><g id="ghost"></g><g id="areas"></g><g id="walls"></g><g id="labels"></g></svg><div class="toolbar"><button id="zoom-in" aria-label="Zoom in">+</button><button id="zoom-out" aria-label="Zoom out">−</button><button id="fit-floor">Fit floor</button><button id="fit">Fit stack</button></div><div class="legend" id="legend">Blue: selected floor · Grey: other floors · Orange: tentative nearby area<br>Local dimensions in metres · Drag to pan / scroll to zoom</div></section></main><script>
'use strict';const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';let data,building,floor,view,base,baseStack,baseFloor,drag;let reviews={};
function node(tag,props,text){const n=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(props))n.setAttribute(k,v);if(text)n.textContent=text;return n;}
function path(points,closed=false){return 'M'+points.map(p=>`${p[0]},${-p[1]}`).join(' L')+(closed?' Z':'');}
function local(p,f){const d=reviews[f.id]||{rotationDegrees:0,translationMetres:[0,0]};const a=d.rotationDegrees*Math.PI/180;return[p[0]*Math.cos(a)-p[1]*Math.sin(a)+d.translationMetres[0],p[0]*Math.sin(a)+p[1]*Math.cos(a)+d.translationMetres[1]];}
function controls(){const d=reviews[floor.id]||{rotationDegrees:0,translationMetres:[0,0]};$('rotation').value=String(d.rotationDegrees);$('east').value=String(d.translationMetres[0]);$('north').value=String(d.translationMetres[1]);}
function update(){ const svg=$('drawing');svg.setAttribute('viewBox',view.join(' '));const b=svg.getBoundingClientRect(),font=Math.max(view[2]/Math.max(1,b.width),view[3]/Math.max(1,b.height))*13;svg.querySelectorAll('text').forEach(t=>t.setAttribute('font-size',font)); }
function render(){$('selection').textContent='';const campus=$('building').value==='campus';$('fit-floor').textContent=campus?'Fit campus':'Fit floor';$('fit').textContent=campus?'Fit all paths':'Fit stack';$('room-title').style.display=campus?'none':'';$('search').style.display=campus?'none':'';$('alignment-review').style.display=campus?'none':'';$('connections-title').textContent=campus?'Pathway evidence':'Stair connections';$('source').textContent=campus?`${data.campusReference.source.name} · source ${data.campusReference.source.sha256.slice(0,16)}… · ${data.campusReference.registration.controlCount} configured controls · ${data.campusReference.registration.rmsMetres} m RMS · unsurveyed approximate placement.`:`Source ${data.sourceSha256.slice(0,16)}… · Drawing scale ${data.unitEvidence.metresPerDrawingUnit} metres/unit. Native geometry, elevations and routes unchanged.`;for(const id of ['ghost','areas','walls','labels'])$(id).replaceChildren();let points=[],activePoints=[];
 if(campus){const ref=data.campusReference,origin=ref.geojson.features[0].geometry.coordinates[0];for(const feature of ref.geojson.features){const p=feature.geometry.coordinates.map(c=>[(c[0]-origin[0])*111320*Math.cos(origin[1]*Math.PI/180),(c[1]-origin[1])*111320]);points.push(...p);if(feature.properties.kind==='sidewalk')activePoints.push(...p);$('walls').append(node('path',{d:path(p),fill:'none',stroke:feature.properties.kind==='trail'?'#987445':'#176c8a','stroke-width':1.5,'vector-effect':'non-scaling-stroke'}));}$('facts').textContent=`${ref.geojson.features.length} sidewalk/trail edges · ${ref.registration.rmsMetres} m control-fit RMS`;$('status').textContent='Approximate placement from configured building controls. These lines are drawing edges, not approved routes.';$('rooms').replaceChildren();$('connections').textContent='No outdoor route graph created.';$('floor').disabled=true;$('overlay').disabled=true;for(const id of ['rotation','east','north','save-alignment','reset-alignment','symbols'])$(id).disabled=true;$('legend').textContent='Blue: sidewalk edges · Brown: trails · Approximate geographic reference';}
 else{building=data.buildings.find(b=>b.id===$('building').value);floor=building.floors.find(f=>f.id===$('floor').value)||building.floors[0];$('floor').disabled=false;$('overlay').disabled=false;for(const id of ['rotation','east','north','save-alignment','reset-alignment','symbols'])$(id).disabled=false;controls();$('legend').textContent='Blue: selected floor · Grey: other floors · Orange: tentative nearby area · Metres';const visible=$('overlay').checked?building.floors:[floor];for(const f of visible){const active=f===floor;for(const l of f.linework){const lp=l.pointsMetres.map(p=>local(p,f));points.push(...lp);if(active)activePoints.push(...lp);(active?$('walls'):$('ghost')).append(node('path',{d:path(lp),fill:'none',stroke:active?'#244657':'#adb7bf','stroke-opacity':active?1:.45,'stroke-width':active?1:.7,'vector-effect':'non-scaling-stroke'}));}if(active)for(const r of f.rooms){if(r.ringsMetres.length){const p=node('path',{d:r.ringsMetres.map(r=>path(r.map(p=>local(p,f)),true)).join(' '),fill:r.matchMode==='contains'?'#70badb40':'#e8aa3830',stroke:r.matchMode==='contains'?'#2984a8':'#b57718','stroke-width':.7,'fill-rule':'evenodd','vector-effect':'non-scaling-stroke'});p.onclick=()=>pick(r);$('areas').append(p);}}}
 const extent=points.reduce((a,p)=>[Math.min(a[0],p[0]),Math.min(a[1],p[1]),Math.max(a[2],p[0]),Math.max(a[3],p[1])],[Infinity,Infinity,-Infinity,-Infinity]);const font=Math.max(extent[2]-extent[0],extent[3]-extent[1])/85;for(const r of floor.rooms){const t=node('text',{x:local(r.anchorMetres,floor)[0],y:-local(r.anchorMetres,floor)[1],'font-size':font,fill:'#145678'},r.number);t.onclick=()=>pick(r);$('labels').append(t);}
 $('facts').textContent=`${floor.rooms.length} room labels · ${building.floors.length} floors · alignment ${(floor.alignment.rotationDegrees+(reviews[floor.id]?.rotationDegrees||0))%360}°${reviews[floor.id]?' · review adjustment':''} · ${floor.alignment.status==='local-reference'?'base drawing axes':`linework fit ${Math.round(100*floor.alignment.overlapScore)}%`}`;$('status').textContent=`Campus placement and elevations unassigned. ${floor.alignment.status==='local-reference'?'Base drawing orientation.':floor.alignment.status==='needs-review'?'Alignment needs review; the wall comparison is uncertain. Check the grey outlines and stairs.':'Floor orientation and translation are provisional; compare the grey outlines and stairs.'}`;rooms();if($('symbols').checked)for(const hint of floor.stairSymbols||[]){const p=node('path',{d:hint.ringsMetres.map(r=>path(r.map(p=>local(p,floor)),true)).join(' '),fill:'#b956bd20',stroke:'#9d37a4','stroke-dasharray':'4 3','stroke-width':1.5,'vector-effect':'non-scaling-stroke'});p.onclick=()=>{$('selection').textContent=`Schematic stair hint: ${hint.treadCount} regular tread lines, ${hint.medianSpacingMetres} m median spacing. Source handles ${hint.sourceHandles.join(', ')}. Landing, rise and floor connection require review.`;};$('labels').append(p);}$('connections').replaceChildren();for(const c of building.connectors){const a=building.floors.find(f=>f.id===c.fromFloor),b=building.floors.find(f=>f.id===c.toFloor),ra=a.rooms.find(r=>r.key===c.fromRoom)||{number:`${a.name} stair hint`,name:'Unlabelled schematic stair',anchorMetres:c.fromPointMetres,ringsMetres:[],source:{sheet:'tread-run comparison',handle:c.fromHint}},rb=b.rooms.find(r=>r.key===c.toRoom)||{number:`${b.name} stair hint`,name:'Unlabelled schematic stair',anchorMetres:c.toPointMetres,ringsMetres:[],source:{sheet:'tread-run comparison',handle:c.toHint}};const btn=document.createElement('button');btn.textContent=`${ra.number} ↔ ${rb.number} · ${c.offsetMetres} m drawing offset`;btn.onclick=()=>{$('floor').value=a.id;render();pick(ra);const p1=local(ra.anchorMetres,a),p2=local(rb.anchorMetres,b);$('labels').append(node('path',{d:path([p1,p2]),fill:'none',stroke:'#a02cb5','stroke-width':2,'stroke-dasharray':'4 3','vector-effect':'non-scaling-stroke'}));for(const p of [p1,p2])$('labels').append(node('circle',{cx:p[0],cy:-p[1],r:.3,fill:'#a02cb5'}));$('selection').textContent=`${c.evidence}. Landing, entrances and height need review before routing.`;};$('connections').append(btn);}if(!building.connectors.length)$('connections').textContent='No matching stair label families between floors. Inspect the magenta tread hints; no connection has been invented.';const hintText=document.createElement('p');hintText.textContent=`${(floor.stairSymbols||[]).length} regular tread hints on this floor. Lift lobbies and mechanical rooms do not establish a shaft or served floors.`;$('connections').append(hintText);
 }
 function extent(ps){const xs=ps.map(p=>p[0]),ys=ps.map(p=>-p[1]);return[Math.min(...xs)-2,Math.min(...ys)-2,Math.max(...xs)-Math.min(...xs)+4,Math.max(...ys)-Math.min(...ys)+4];}baseStack=extent(points);baseFloor=extent(activePoints.length?activePoints:points);base=baseFloor;view=[...base];update();}
function rooms(){const query=$('search').value.toLowerCase();$('rooms').replaceChildren();for(const r of floor.rooms){if(!`${r.number} ${r.name}`.toLowerCase().includes(query))continue;const b=document.createElement('button');b.className='room';b.textContent=`${r.number} · ${r.name}`;b.onclick=()=>pick(r);$('rooms').append(b);}}
function pick(r){$('selection').textContent=`${r.number} · ${r.name}. ${r.matchMode==='contains'?'Tentative boundary contains the label.':r.matchMode==='buffer'?'Nearby polygon needs review.':'No closed boundary recovered; source lines and label retained.'} Source: ${r.source.sheet} / ${r.source.handle}.`;const ps=r.ringsMetres.flat().map(p=>local(p,floor));if(!ps.length)ps.push(local(r.anchorMetres,floor));const xs=ps.map(p=>p[0]),ys=ps.map(p=>-p[1]),w=Math.max(8,Math.max(...xs)-Math.min(...xs)),h=Math.max(8,Math.max(...ys)-Math.min(...ys));view=[(Math.min(...xs)+Math.max(...xs))/2-w,(Math.min(...ys)+Math.max(...ys))/2-h,2*w,2*h];update();}
function openBuilding(){building=data.buildings.find(b=>b.id===$('building').value);$('floor').replaceChildren();for(const f of building?.floors||[]){const o=document.createElement('option');o.value=f.id;o.textContent=f.name;$('floor').append(o);}render();}
$('building').onchange=openBuilding;$('floor').onchange=render;$('overlay').onchange=render;$('symbols').onchange=render;$('search').oninput=()=>{if(building)rooms();};$('fit').onclick=()=>{base=baseStack;view=[...base];update();};$('fit-floor').onclick=()=>{base=baseFloor;view=[...base];update();};function zoom(z){view=[view[0]+view[2]*(1-z)/2,view[1]+view[3]*(1-z)/2,view[2]*z,view[3]*z];update();}$('zoom-in').onclick=()=>zoom(.8);$('zoom-out').onclick=()=>zoom(1.25);const svg=$('drawing');window.addEventListener('resize',()=>{if(view)update();});svg.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,v:[...view]};svg.setPointerCapture(e.pointerId);};svg.onpointermove=e=>{if(!drag)return;const b=svg.getBoundingClientRect(),s=Math.max(view[2]/b.width,view[3]/b.height);view=[drag.v[0]-(e.clientX-drag.x)*s,drag.v[1]-(e.clientY-drag.y)*s,drag.v[2],drag.v[3]];update();};svg.onpointerup=()=>drag=null;svg.onpointercancel=()=>drag=null;svg.onwheel=e=>{e.preventDefault();if(view[2]>.5&&view[2]<base[2]*8)zoom(e.deltaY>0?1.12:1/1.12);};
$('save-alignment').onclick=()=>{const dx=Number($('east').value),dy=Number($('north').value);if(!Number.isFinite(dx)||!Number.isFinite(dy)||Math.abs(dx)>200||Math.abs(dy)>200){$('review-status').textContent='Use finite adjustments between −200 and 200 metres.';return;}reviews[floor.id]={floorId:floor.id,rotationDegrees:Number($('rotation').value),translationMetres:[dx,dy],updatedAt:new Date().toISOString(),status:'human alignment review'};try{localStorage.setItem(`cad-floor-reviews:${data.evidenceSha256}`,JSON.stringify(reviews));$('review-status').textContent='Saved separately from the original intake. Download floor reviews to keep with the ZIP.';}catch{$('review-status').textContent='Download floor reviews to preserve this adjustment.';}render();};
$('reset-alignment').onclick=()=>{delete reviews[floor.id];try{localStorage.setItem(`cad-floor-reviews:${data.evidenceSha256}`,JSON.stringify(reviews));}catch{}render();$('review-status').textContent='Restored the original provisional alignment.';};
$('export-review').onclick=()=>{const link=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify({format:'openindoormaps-cad-floor-reviews',version:1,sourceSha256:data.sourceSha256,evidenceSha256:data.evidenceSha256,appliedToNativeGeometry:false,records:Object.values(reviews)},null,2)],{type:'application/json'}));link.href=url;link.download='UNBC.building-intake-review.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),5000);};
(async()=>{try{const r=await fetch('intake.json');if(!r.ok)throw Error('Intake file unavailable');data=await r.json();try{const saved=JSON.parse(localStorage.getItem(`cad-floor-reviews:${data.evidenceSha256}`)||'{}');for(const [id,d] of Object.entries(saved)){if(data.buildings.some(b=>b.floors.some(f=>f.id===id))&&[0,90,180,270].includes(d.rotationDegrees)&&Array.isArray(d.translationMetres)&&d.translationMetres.length===2&&d.translationMetres.every(x=>Number.isFinite(x)&&Math.abs(x)<=200))reviews[id]=d;}}catch{}$('summary').textContent=`${data.buildings.length} unplaced buildings · ${data.buildings.reduce((n,b)=>n+b.floors.length,0)} schematic floors · ${data.buildings.reduce((n,b)=>n+b.floors.reduce((n,f)=>n+f.rooms.length,0),0)} room labels`;$('source').textContent=`Source ${data.sourceSha256.slice(0,16)}… · Drawing scale ${data.unitEvidence.metresPerDrawingUnit} metres/unit. Native geometry, elevations and routes unchanged.`;for(const b of data.buildings){const o=document.createElement('option');o.value=b.id;o.textContent=`${b.code} · ${b.name}`;$('building').append(o);}const o=document.createElement('option');o.value='campus';o.textContent='Campus · pathway reference';$('building').append(o);openBuilding();}catch(e){$('summary').textContent=e.message;}})();
</script></body></html>
